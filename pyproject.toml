[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-imputer"
version = "1.2.0"
description = "CRISP: Compositional Ratio-based Imputation with Simplex Projection — constraint-guaranteed imputation for compositional data with structural zeros"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wenyu2026" }]
requires-python = ">=3.8"
dependencies = [
    # The library is pure NumPy. pandas / scikit-learn are needed only by the
    # benchmark scripts shipped in the repository, not by `import crisp`.
    "numpy>=1.20.0",
]
keywords = ["imputation", "missing-values", "compositional-data", "simplex", "materials-science", "structural-zeros"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
